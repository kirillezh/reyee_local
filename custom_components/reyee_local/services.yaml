scan_access_points:
  name: Scan access points
  description: >
    Read-only scan of every access point the router knows, to see what can be
    added for APs. Writes /config/reyee_aps.json and shows a notification.

deep_probe:
  name: Deep network probe
  description: >
    Sweeps the router's local API and posts the raw responses as a notification.
    Diagnostic tool for discovering what your firmware exposes.

set_primary_wan:
  name: Set primary WAN
  description: >
    Switch which WAN uplink is the primary (master) line. The gateway applies
    this asynchronously and may drop the management path briefly.
  fields:
    ifname:
      name: Interface
      description: WAN interface name (e.g. wan, wan1)
      required: true
      example: wan1
      selector:
        text:

set_forced_switch:
  name: Set forced switch
  description: >
    Turn "Forced Switch" on or off. When on, all traffic uses the primary WAN
    unless it drops entirely.
  fields:
    enabled:
      name: Enabled
      description: Whether forced switch should be on
      required: true
      selector:
        boolean:

add_port_forward:
  name: Add port forward
  description: >
    Create (or replace by name) a port-forwarding rule. Existing rules are
    preserved. Applies immediately.
  fields:
    name:
      name: Rule name
      description: Unique name for the rule (replaces any existing rule with this name)
      required: true
      example: NVR HTTPS
      selector:
        text:
    wan_port:
      name: WAN port
      description: External port on the internet side
      required: true
      example: 8443
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    lan_ip:
      name: LAN IP
      description: Internal device IP to forward to
      required: true
      example: 192.168.88.99
      selector:
        text:
    lan_port:
      name: LAN port
      description: Internal port on the device
      required: true
      example: 443
      selector:
        number:
          min: 1
          max: 65535
          mode: box
    protocol:
      name: Protocol
      required: false
      default: tcp
      selector:
        select:
          options: [tcp, udp, tcp+udp]
    wan_interface:
      name: WAN interface
      description: Which WAN line (wan or wan1)
      required: false
      default: wan
      selector:
        text:

remove_port_forward:
  name: Remove port forward
  description: Delete a port-forwarding rule by name.
  fields:
    name:
      name: Rule name
      description: Name of the rule to remove
      required: true
      example: NVR HTTPS
      selector:
        text:

set_ssid:
  name: Set WiFi SSID on/off
  description: Enable or disable a WiFi SSID by its wlan_id.
  fields:
    wlan_id:
      name: WLAN ID
      description: The SSID's wlan_id (see the Reyee WiFi SSIDs sensor attributes)
      required: true
      example: "8"
      selector:
        text:
    enabled:
      name: Enabled
      required: true
      selector:
        boolean:

block_device:
  name: Block device internet
  description: Block a device (by MAC) from reaching the internet (access_ctrl REJECT rule).
  fields:
    mac:
      name: MAC address
      required: true
      example: "a8:48:fa:f0:08:be"
      selector:
        text:
    name:
      name: Rule name
      required: false
      example: Kids tablet
      selector:
        text:

unblock_device:
  name: Unblock device internet
  description: Remove the internet block for a device (by MAC).
  fields:
    mac:
      name: MAC address
      required: true
      example: "a8:48:fa:f0:08:be"
      selector:
        text:

set_rate_limit:
  name: Set WiFi rate limit
  description: Global wireless per-station rate cap in kbps (0 = unlimited).
  fields:
    upload_kbps:
      name: Upload limit (kbps)
      required: false
      example: 5000
      selector:
        number:
          min: 0
          max: 1000000
          mode: box
    download_kbps:
      name: Download limit (kbps)
      required: false
      example: 10000
      selector:
        number:
          min: 0
          max: 1000000
          mode: box

set_port_description:
  name: Switch — set port description
  description: Set the description of a port on a managed switch entry.
  fields:
    switch_ip: {name: Switch IP, required: true, example: 192.168.88.162, selector: {text: {}}}
    port: {name: Port, description: "Port name, e.g. Gi7", required: true, example: Gi7, selector: {text: {}}}
    description: {name: Description, example: Patio AP, selector: {text: {}}}

set_port_vlan:
  name: Switch — set port VLAN
  description: >
    Set a port's VLAN mode. access = one VLAN (pvid). trunk = native pvid +
    allowed VLANs. The uplink port is refused.
  fields:
    switch_ip: {name: Switch IP, required: true, example: 192.168.88.162, selector: {text: {}}}
    port: {name: Port, required: true, example: Gi7, selector: {text: {}}}
    mode: {name: Mode, required: true, selector: {select: {options: [access, trunk, hybrid]}}}
    pvid: {name: Native / access VLAN, required: true, example: 30, selector: {number: {min: 1, max: 4094, mode: box}}}
    permit_vlans: {name: Allowed VLANs (trunk), example: "1,20,30,89", selector: {text: {}}}
    untag_vlans: {name: Untagged VLANs (hybrid), selector: {text: {}}}

set_port_isolation:
  name: Switch — port isolation
  description: Isolated ports can't talk to each other, only to non-isolated ports (e.g. the uplink).
  fields:
    switch_ip: {name: Switch IP, required: true, example: 192.168.88.162, selector: {text: {}}}
    port: {name: Port, required: true, example: Gi7, selector: {text: {}}}
    enabled: {name: Isolated, required: true, selector: {boolean: {}}}

set_port_rate_limit:
  name: Switch — port bandwidth limit
  description: Limit a port's speed in kbps. Set both to 0 to remove the limit.
  fields:
    switch_ip: {name: Switch IP, required: true, example: 192.168.88.162, selector: {text: {}}}
    port: {name: Port, required: true, example: Gi7, selector: {text: {}}}
    in_kbps: {name: Inbound limit (kbps), example: 10000, selector: {number: {min: 0, max: 1000000, mode: box}}}
    out_kbps: {name: Outbound limit (kbps), example: 10000, selector: {number: {min: 0, max: 1000000, mode: box}}}

create_vlan:
  name: Switch — create VLAN
  description: Create a VLAN on a managed switch entry.
  fields:
    switch_ip: {name: Switch IP, required: true, example: 192.168.88.162, selector: {text: {}}}
    vlan_id: {name: VLAN ID, required: true, example: 40, selector: {number: {min: 2, max: 4094, mode: box}}}
    name: {name: Name, example: IOT VLAN, selector: {text: {}}}

delete_vlan:
  name: Switch — delete VLAN
  description: Delete a VLAN from a managed switch entry (VLAN 1 can't be deleted).
  fields:
    switch_ip: {name: Switch IP, required: true, example: 192.168.88.162, selector: {text: {}}}
    vlan_id: {name: VLAN ID, required: true, example: 40, selector: {number: {min: 2, max: 4094, mode: box}}}
